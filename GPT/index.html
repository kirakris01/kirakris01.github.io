<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>GIGAKK</title>
</head>
<body style="background:black;color:white;font-family:sans-serif">

<h2>GIGAKK</h2>

<button onclick="login()">Войти через Google</button>
<p id="user"></p>

<div id="chat"></div>

<input id="input">
<button onclick="send()">Отправить</button>

<script>
async function login(){
    window.location.href = "http://localhost:3000/auth/google";
}

async function loadUser(){
    const res = await fetch("http://localhost:3000/user", {
        credentials: "include"
    });
    const user = await res.json();

    if(user){
        document.getElementById("user").innerText = "👤 " + user.displayName;
    }
}
loadUser();

function add(text){
    const div = document.createElement("div");
    div.innerText = text;
    document.getElementById("chat").appendChild(div);
}

// ===== STREAM =====
async function send(){
    const text = document.getElementById("input").value;

    add("Ты: " + text);

    const res = await fetch("http://localhost:3000/chat", {
        method: "POST",
        credentials: "include",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({message:text})
    });

    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    let aiText = "";
    add("GIGAKK: ");

    while(true){
        const {done, value} = await reader.read();
        if(done) break;

        const chunk = decoder.decode(value);
        aiText += chunk;

        document.getElementById("chat").lastChild.innerText = "GIGAKK: " + aiText;
    }
}
</script>

</body>
</html>
